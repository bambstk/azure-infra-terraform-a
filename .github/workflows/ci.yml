name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - uses: hashicorp/setup-terraform@v4
    - name: Azure login
      uses: azure/login@v3
      with:
        client-id: 7f95b0e5-50c1-4c21-b58c-4fb245bacffd
        tenant-id: a2e466aa-4f86-4545-b5b8-97da7c8febf3
        subscription-id: 5e683e0f-b00c-48d6-9769-5aaf598de8f1

    - name: Terraform fmt
      id: fmt
      run: cd terraform/ && terraform fmt -check

    - name: Terraform Init
      id: init
      run: cd terraform/ && terraform init -input=false

    - name: Terraform Validate
      id: validate
      run: cd terraform/ && terraform validate -no-color

    - name: Terraform Plan
      id: plan
      run: cd terraform/ && terraform plan -no-color -input=false
      continue-on-error: true

